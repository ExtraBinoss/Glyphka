<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Create geometric lettering, compose symbols and explore their forms in 3D. A free generative studio in your browser, with SVG and PNG export."
    />
    <meta name="application-name" content="Glyphka" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://glyphka.plinka.eu/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Glyphka" />
    <meta property="og:url" content="https://glyphka.plinka.eu/" />
    <meta property="og:title" content="Glyphka — Shape your own language" />
    <meta
      property="og:description"
      content="Create geometric lettering, compose symbols and explore their forms in 3D. A free generative studio in your browser, with SVG and PNG export."
    />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta
      property="og:image"
      content="https://glyphka.plinka.eu/social/glyphka.png"
    />
    <meta
      property="og:image:secure_url"
      content="https://glyphka.plinka.eu/social/glyphka.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Glyphka: its Stencil wordmark, nine colorful letters, Try it! and glyphka.plinka.eu on a light background."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Glyphka — Shape your own language" />
    <meta
      name="twitter:description"
      content="Create geometric lettering, compose symbols and explore their forms in 3D. A free generative studio in your browser, with SVG and PNG export."
    />
    <meta
      name="twitter:image"
      content="https://glyphka.plinka.eu/social/glyphka.png"
    />
    <meta
      name="twitter:image:alt"
      content="Glyphka: its Stencil wordmark, nine colorful letters, Try it! and glyphka.plinka.eu on a light background."
    />
    <meta name="theme-color" content="#fbfbfd" />
    <script>
      try {
        const theme = localStorage.getItem("glyphka.theme") || "system";
        const dark =
          theme === "dark" ||
          (theme === "system" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.querySelector('meta[name="theme-color"]').content = dark
          ? "#1c1c1e"
          : "#fbfbfd";
      } catch {
        document.documentElement.classList.toggle(
          "dark",
          matchMedia("(prefers-color-scheme: dark)").matches,
        );
      }
    </script>
    <script>
      if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
        document.documentElement.dataset.glyphkaIntro = "pending";
        setTimeout(() => {
          if (document.documentElement.dataset.glyphkaIntro === "pending")
            delete document.documentElement.dataset.glyphkaIntro;
        }, 4500);
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      href="/node_modules/@fontsource-variable/source-sans-3/files/source-sans-3-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Glyphka — Shape your own language</title>
    <style>
      html {
        background: #fbfbfd;
        color-scheme: light;
      }
      html.dark {
        background: #1c1c1e;
        color-scheme: dark;
      }
      .startup-intro {
        display: none;
      }
      html[data-glyphka-intro] .studio {
        opacity: 0;
        pointer-events: none;
      }
      html[data-glyphka-intro] .startup-intro {
        display: grid;
        position: fixed;
        inset: 0;
        z-index: 100;
        place-items: center;
      }
      .startup-veil {
        position: absolute;
        inset: 0;
        background: #fbfbfd;
      }
      html.dark .startup-veil {
        background: #1c1c1e;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
